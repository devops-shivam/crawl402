name: Release

# Publishes to npm when you publish a GitHub Release (tag like v0.1.0).
# Setup: add an npm automation token as the repository secret NPM_TOKEN.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Check tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then echo "Tag v$TAG does not match package.json $VERSION"; exit 1; fi
      # Provenance needs a public repository, so it's only added once the repo is public.
      - run: npm publish --access public ${{ github.event.repository.private == false && '--provenance' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
