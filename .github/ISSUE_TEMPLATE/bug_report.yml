name: Bug report
description: Something isn't working as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: A minimal config and the request (User-Agent, path, headers) that triggers it.
      render: ts
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "crawl402 0.1.0, next 16.0.1, Node 22, Vercel"
    validations:
      required: true
